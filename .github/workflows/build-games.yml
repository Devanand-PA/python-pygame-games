name: Build Games

# Every push to main rebuilds BOTH games from scratch and republishes them to
# their rolling release tags.
#
# The two games are built simultaneously: `build-paddle` and `build-bigtower`
# declare no `needs:` on each other, so all six runners (2 games x 3 operating
# systems) are scheduled at once instead of one game waiting for the other.
# Each game publishes from its own release job that depends only on its own
# builds, so a paddle failure never delays a bigtower release.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Release publishing needs write access; everything else stays read-only.
permissions:
  contents: write

# A newer push makes an in-flight run obsolete, so cancel it rather than queue
# another full 6-runner build behind it.
concurrency:
  group: build-games-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-paddle:
    name: Paddle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: paddle
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build self-contained executable
        run: python build.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: paddle-${{ matrix.os }}
          path: paddle/dist/*.zip
          if-no-files-found: error

  build-bigtower:
    name: Big Tower (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: bigtower
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame numpy pyinstaller

      - name: Smoke test (headless)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tools/flow_test.py

      - name: Build self-contained executable
        run: python build.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bigtower-${{ matrix.os }}
          path: bigtower/dist/*.zip
          if-no-files-found: error

  release-paddle:
    name: Publish Paddle release
    needs: build-paddle
    runs-on: ubuntu-latest

    steps:
      - name: Download all Paddle build artifacts
        uses: actions/download-artifact@v4
        with:
          name: paddle-*
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: paddle-latest
          name: "Paddle — latest build"
          body: |
            Automatic build of **Paddle** from commit `${{ github.sha }}`
            (branch `${{ github.ref_name }}`).

            Every archive contains a single self-contained executable plus an
            empty `saves/` folder where the game stores your progress.

            **Linux / macOS:** unzip, then run `chmod +x paddle && ./paddle`
            **Windows:** unzip and run `paddle.exe`
          files: dist/*.zip
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true

  release-bigtower:
    name: Publish Big Tower release
    needs: build-bigtower
    runs-on: ubuntu-latest

    steps:
      - name: Download all Big Tower build artifacts
        uses: actions/download-artifact@v4
        with:
          name: bigtower-*
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bigtower-latest
          name: "Big Tower — latest build"
          body: |
            Automatic build of **Big Tower** from commit `${{ github.sha }}`
            (branch `${{ github.ref_name }}`).

            Every archive contains a single self-contained executable with the
            game code, art, audio and maps bundled inside — no loose asset
            folder required.

            **Linux / macOS:** unzip, then run `chmod +x bigtower && ./bigtower`
            **Windows:** unzip and run `bigtower.exe`
          files: dist/*.zip
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true