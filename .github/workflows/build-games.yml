name: Build Games

# Every push to main rebuilds BOTH games from scratch and republishes them into
# a single rolling "python-pygame-games-latest" release.
#
# The two games are built simultaneously: `build-paddle` and `build-bigtower`
# declare no `needs:` on each other, so all six runners (2 games x 3 operating
# systems) are scheduled at once instead of one game waiting for the other.
# Only the final `publish-release` step is serialised, since both games have to
# land in the same release.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Release publishing needs write access; everything else stays read-only.
permissions:
  contents: write

# A newer push makes an in-flight run obsolete, so cancel it rather than queue
# another full 6-runner build behind it.
concurrency:
  group: build-games-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-paddle:
    name: Paddle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: paddle
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build self-contained executable
        run: python build.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: paddle-${{ matrix.os }}
          path: paddle/dist/*.zip
          if-no-files-found: error

  build-bigtower:
    name: Big Tower (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: bigtower
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame numpy pyinstaller

      - name: Smoke test (headless)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tools/flow_test.py

      - name: Build self-contained executable
        run: python build.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bigtower-${{ matrix.os }}
          path: bigtower/dist/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish combined release
    # Waits for both games so the release always carries the full set of assets.
    # The builds themselves still run simultaneously -- only the single publish
    # step is serialised.
    needs: [build-paddle, build-bigtower]
    runs-on: ubuntu-latest

    steps:
      - name: Download Paddle build artifacts
        uses: actions/download-artifact@v4
        with:
          # `pattern`, not `name`: `name` selects a single artifact by exact
          # name and takes precedence over `pattern`, so `name: paddle-*`
          # searches for an artifact literally called "paddle-*" and fails.
          pattern: paddle-*
          path: dist
          merge-multiple: true

      - name: Download Big Tower build artifacts
        uses: actions/download-artifact@v4
        with:
          # See the note above: wildcards go in `pattern`.
          pattern: bigtower-*
          path: dist
          merge-multiple: true

      - name: List downloaded archives
        run: ls -lh dist/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: python-pygame-games-latest
          name: "python-pygame-games — latest build"
          body: |
            Automatic build of both games from commit `${{ github.sha }}`
            (branch `${{ github.ref_name }}`), built for Linux, Windows and macOS.

            Download the archive whose name matches your platform:

            | Archive | Platform |
            | --- | --- |
            | `paddle-linux-x86_64.zip` | Paddle — Linux |
            | `paddle-windows-x86_64.zip` | Paddle — Windows |
            | `paddle-macos-arm64.zip` | Paddle — macOS (Apple Silicon) |
            | `bigtower-linux-x86_64.zip` | Big Tower — Linux |
            | `bigtower-windows-x86_64.zip` | Big Tower — Windows |
            | `bigtower-macos-arm64.zip` | Big Tower — macOS (Apple Silicon) |

            Every archive contains a single self-contained executable, so there
            is no loose asset folder to carry around.

            **Linux / macOS:** unzip, then run `chmod +x <game> && ./<game>`
            **Windows:** unzip and run `<game>.exe`

            The Paddle archives also ship an empty `saves/` folder, which is
            where the game stores your progress.
          files: dist/*.zip
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
